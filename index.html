&lt;script&gt;
const base=[[&quot;Veggente&quot;,&quot;🔮&quot;,&quot;Ogni notte può scegliere un giocatore da controllare. Il Narratore gli comunica, secondo le regole della partita, se il giocatore appartiene o meno alla fazione dei Lupi. Deve usare queste informazioni senza rivelarsi troppo facilmente.&quot;],[&quot;Meretrice&quot;,&quot;💋&quot;,&quot;Durante la notte svolge un’azione speciale stabilita dal Narratore. Prima della partita il Narratore può spiegare esattamente il potere scelto per questa variante.&quot;],[&quot;Guardia&quot;,&quot;🛡️&quot;,&quot;Ogni notte sceglie un giocatore da proteggere dall’attacco dei Lupi. Il Narratore decide eventuali limitazioni, ad esempio se può proteggere sempre la stessa persona o anche sé stessa.&quot;],[&quot;Cacciatore&quot;,&quot;🏹&quot;,&quot;Quando viene eliminato, può normalmente scegliere un altro giocatore da colpire prima di uscire definitivamente dalla partita. Il Narratore gestisce il momento e le eventuali protezioni.&quot;],[&quot;Indovino&quot;,&quot;👁️&quot;,&quot;È un investigatore: durante la notte può raccogliere informazioni su altri giocatori. Il tipo preciso di informazione può essere adattato dal Narratore alle regole della vostra partita.&quot;],[&quot;Medium&quot;,&quot;👻&quot;,&quot;Può ottenere dal Narratore informazioni relative ai giocatori morti o alla loro fazione. È utile al villaggio per ricostruire cosa è successo nelle notti precedenti.&quot;],[&quot;Indemoniato&quot;,&quot;😈&quot;,&quot;Conosce o favorisce indirettamente i Lupi, ma non è necessariamente un Lupo. Il suo obiettivo è aiutare la fazione avversaria senza farsi scoprire dal villaggio.&quot;],[&quot;Gufo&quot;,&quot;🦉&quot;,&quot;Ruolo speciale con azione notturna.&quot;],[&quot;Assassino&quot;,&quot;🗡️&quot;,&quot;Possiede un potere offensivo o un obiettivo personale che può danneggiare altri giocatori. Il Narratore stabilisce quando e come può usare la sua abilità.&quot;],[&quot;Avvocato&quot;,&quot;⚖️&quot;,&quot;Può influenzare decisioni, protezioni o dinamiche legate a un altro giocatore. È un ruolo strategico che richiede regole definite dal Narratore prima dell’inizio.&quot;],[&quot;Angelo Custode&quot;,&quot;👼&quot;,&quot;È un protettore del villaggio. Può intervenire per salvare o difendere un giocatore secondo le regole concordate, spesso durante la fase notturna.&quot;],[&quot;Matto&quot;,&quot;🤪&quot;,&quot;Ha condizioni di gioco differenti.&quot;],[&quot;Demone&quot;,&quot;👹&quot;,&quot;Personaggio con poteri speciali.&quot;],[&quot;Zombie&quot;,&quot;🧟&quot;,&quot;Modifica la gestione della morte.&quot;],[&quot;Scemo del Villaggio&quot;,&quot;🤡&quot;,&quot;Ruolo speciale del villaggio.&quot;],[&quot;Cappuccetto Rosso&quot;,&quot;🧺&quot;,&quot;Personaggio con interazioni dedicate.&quot;],[&quot;Censuratore&quot;,&quot;🤐&quot;,&quot;Può limitare azioni o comunicazioni.&quot;],[&quot;Carceriere&quot;,&quot;🔒&quot;,&quot;Può bloccare un giocatore.&quot;],[&quot;Romeo&quot;,&quot;❤️&quot;,&quot;Ruolo collegato a dinamiche di coppia.&quot;],[&quot;Giulietta&quot;,&quot;💘&quot;,&quot;Ruolo collegato a dinamiche di coppia.&quot;],[&quot;Duca&quot;,&quot;👑&quot;,&quot;Personaggio speciale.&quot;],[&quot;Duchessa&quot;,&quot;👸&quot;,&quot;Personaggio speciale.&quot;],[&quot;Scrutatore&quot;,&quot;🔍&quot;,&quot;Personaggio investigativo.&quot;],[&quot;Cieco&quot;,&quot;🦯&quot;,&quot;Ha informazioni differenti.&quot;],[&quot;Copiatore&quot;,&quot;📋&quot;,&quot;Può copiare caratteristiche previste.&quot;]];
let players=JSON.parse(localStorage.getItem(&quot;lp&quot;)||&quot;[]&quot;),custom=JSON.parse(localStorage.getItem(&quot;lr&quot;)||&quot;[]&quot;),game=[],cur=0,currentLobbyName=null;
const all=()=&gt;[...base,...custom];const esc=s=&gt;{let d=document.createElement(&quot;div&quot;);d.textContent=s;return d.innerHTML};
const photoDB={db:null,async open(){if(this.db)return this.db;return this.db=await new Promise((res,rej)=>{let r=indexedDB.open('gamehub_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},async set(k,v){let d=await this.open();return new Promise((res,rej)=>{let t=d.transaction('photos','readwrite');t.objectStore('photos').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},async get(k){let d=await this.open();return new Promise((res,rej)=>{let t=d.transaction('photos','readonly').objectStore('photos').get(k);t.onsuccess=()=>res(t.result||'');t.onerror=()=>rej(t.error)})}};
function persist(){localStorage.setItem(&quot;lp&quot;,JSON.stringify(players.map(p=>({...p,photo:''}))));localStorage.setItem(&quot;lr&quot;,JSON.stringify(custom))}

async function compressPhoto(file){return new Promise((res,rej)=>{let u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let max=640,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=u})}
function renderPlayers(){playersList.innerHTML=players.map((p,i)=&gt;`&lt;div class=&quot;player&quot;&gt;${p.photo?`&lt;img class=&quot;avatar&quot; src=&quot;${p.photo}&quot;&gt;`:&#x27;&lt;div class=&quot;avatar&quot;&gt;👤&lt;/div&gt;&#x27;}&lt;div class=&quot;pinfo&quot;&gt;&lt;div class=&quot;pname&quot;&gt;${esc(p.name)}&lt;/div&gt;&lt;div class=&quot;small&quot;&gt;${p.photo?&quot;Foto aggiunta&quot;:&quot;Nessuna foto&quot;}&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;btn secondary&quot; onclick=&quot;photo(${i})&quot;&gt;📷&lt;/button&gt;&lt;button class=&quot;btn danger&quot; onclick=&quot;removePlayer(${i})&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;`).join(&quot;&quot;)}

radial-gradient(circle at 10% 0%,rgba(25,201,158,.20),transparent 28%),
radial-gradient(circle at 90% 100%,rgba(99,230,190,.10),transparent 28%),var(--bg);color:var(--text)}
body{padding-bottom:env(safe-area-inset-bottom)}
.hidden{display:none!important}
.app{max-width:1180px;margin:auto;padding:16px 16px 105px}
.hero{text-align:center;padding:12px 8px 18px}
.hero .dice{font-size:58px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.4))}
.hero h1{margin:4px 0;font-size:clamp(30px,6vw,52px);letter-spacing:-1.5px}
.hero h1 span{color:var(--accent)}
.small{font-size:12px;color:var(--muted)}
.card{background:linear-gradient(145deg,rgba(20,39,34,.96),rgba(13,26,23,.96));border:1px solid var(--line);border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 15px 45px rgba(0,0,0,.18)}
.title{font-size:17px;font-weight:900;margin-bottom:12px}
.row{display:flex;gap:9px}
.input{width:100%;padding:13px;border-radius:13px;border:1px solid #35574e;background:#091612;color:#fff;font-size:16px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(25,201,158,.12)}
.btn{border:0;border-radius:13px;padding:13px 16px;background:linear-gradient(135deg,#0b8f72,#19c99e);color:#fff;font-weight:900;cursor:pointer;min-height:46px}
.secondary{background:#263c36}.danger{background:#713044}.gold{background:linear-gradient(135deg,#b88618,#ffd166);color:#1d1706}
.full{width:100%;margin-top:9px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.player{display:flex;align-items:center;gap:10px;padding:10px;background:#0b1815;border:1px solid #203a33;border-radius:15px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#213b34;display:grid;place-items:center;font-size:20px}
.pinfo{flex:1}.pname{font-weight:850}
.validation{text-align:center;margin:12px 0}
.valid{color:#63e6be}.invalid{color:#ff7187}

#game{padding:4px 0 6px}.game-info-sticky{position:sticky;bottom:0;z-index:20;background:rgba(9,24,20,.97);border:1px solid #29453e;border-radius:14px;padding:8px;margin-top:8px;box-shadow:0 -8px 25px rgba(0,0,0,.3);backdrop-filter:blur(10px)}.turn-line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;font-size:13px}.turn-line .small{font-size:8px;color:var(--muted);margin-right:3px}.turn-line strong{font-size:14px}.game-actions{margin:6px 0 0}.game-actions .btn{width:100%;padding:8px;font-size:11px}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.turn-badge{padding:10px 13px;border-radius:999px;background:#15352d;border:1px solid #2d6254;font-weight:850}
.roll-badge{padding:9px 12px;border-radius:12px;background:#0d211c;color:var(--gold);font-weight:900}
.dice-area{display:grid;grid-template-columns:repeat(5,minmax(42px,58px));justify-content:center;gap:5px;margin:4px 0}
.die{
 width:100%;aspect-ratio:1;border-radius:18px;background:linear-gradient(145deg,#fff,#dceae6);
 border:4px solid transparent;color:#15231f;display:grid;place-items:center;position:relative;
 box-shadow:0 13px 25px rgba(0,0,0,.32),inset 0 1px 0 #fff;cursor:pointer;
 font-size:0;transition:transform .18s,border-color .18s,box-shadow .18s;
}
.die.selected{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(25,201,158,.16),0 13px 30px rgba(0,0,0,.35),inset 0 1px 0 #fff;transform:translateY(-5px)}
.die.rolling{animation:dieRoll .58s cubic-bezier(.3,.8,.3,1)}
.die-face{width:76%;height:76%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px}
.dot{width:100%;aspect-ratio:1;border-radius:50%;background:#15231f;align-self:center;justify-self:center}
@keyframes dieRoll{0%{transform:rotate(0) scale(1)}20%{transform:rotate(110deg) scale(.86)}45%{transform:rotate(210deg) scale(1.08)}70%{transform:rotate(310deg) scale(.92)}100%{transform:rotate(360deg) scale(1)}}
.dice-hint{text-align:center;color:var(--muted);font-size:9px;margin:2px 0}
.float-roll{
 position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,calc(18px + env(safe-area-inset-bottom)));
 z-index:50;border:0;border-radius:18px;padding:15px 20px;background:linear-gradient(135deg,#0b8f72,#19c99e);
 color:#fff;font-weight:950;font-size:15px;box-shadow:0 15px 35px rgba(0,0,0,.42);cursor:pointer
}
.float-roll:disabled{opacity:.55;cursor:not-allowed}
.status{text-align:center;min-height:16px;color:#b8d3cb;font-size:10px}

.score-wrap{overflow:hidden;border-radius:12px;border:1px solid #29453e}
.score-table{width:100%;min-width:0;table-layout:fixed;border-collapse:separate;border-spacing:0;background:#0c1815}
.score-table th,.score-table td{border-right:1px solid #29453e;border-bottom:1px solid #29453e;padding:3px 2px;text-align:center;font-size:10px;line-height:1.05}
.score-table th:first-child,.score-table td:first-child{text-align:left;width:25%;background:#10221d}
.score-table thead th{background:#132a24;position:sticky;top:0;z-index:4;font-size:10px}
.score-table th:first-child{z-index:5}
.cat-name{font-weight:850;white-space:nowrap;font-size:10px}.cat-icon{display:inline-block;width:15px;text-align:center;margin-right:2px}
.cat-sub{font-size:8px;color:var(--muted);margin-top:1px}
.score-cell{min-width:0;height:27px;color:#e8faf5;font-weight:850;cursor:pointer;border-radius:8px;transition:.16s}
.score-cell.preview{background:rgba(25,201,158,.10);color:var(--accent2)}
.score-cell.preview:hover{background:rgba(25,201,158,.22);transform:scale(.98)}
.score-cell.locked{color:#fff;background:#17352d}
.score-cell.empty{color:#55756c;background:#0e1d19}
.score-cell.yatzee-bonus{color:var(--gold)}
.total-row td{background:#10221d;font-weight:950;color:#fff;height:25px}
.grand-row td{background:linear-gradient(90deg,#15382f,#10231f);font-size:11px;color:var(--gold);font-weight:950}

.section-label{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.section-label h2{font-size:17px;margin:0}.section-label span{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.game-over{text-align:center;padding:30px 18px}
.winner-name{font-size:clamp(30px,7vw,48px);font-weight:950;color:var(--gold);margin:8px 0}

@media(max-width:650px){
 .app{padding:10px 10px 110px}
 .hero{padding-top:8px}
 .hero .dice{font-size:48px}
 .card{border-radius:18px;padding:13px}
 .row{flex-direction:column}
 .dice-area{gap:7px;grid-template-columns:repeat(5,minmax(48px,68px))}
 .die{border-radius:14px;border-width:3px}
 .score-table{min-width:0}
 .score-table th,.score-table td{padding:3px 2px;font-size:9px}
 .cat-name{font-size:9px}.cat-icon{width:13px}
 .score-cell{height:25px;font-size:10px}
 .grand-row td{font-size:10px}
 .float-roll{left:12px;right:12px;bottom:max(12px,calc(12px + env(safe-area-inset-bottom)));text-align:center}
}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

&lt;div id=&quot;setup&quot; class=&quot;app&quot;&gt;
 &lt;div class=&quot;hero&quot;&gt;&lt;div class=&quot;dice&quot;&gt;🎲🏆&lt;/div&gt;&lt;h1&gt;YAHTZ&lt;span&gt;EE&lt;/span&gt;&lt;/h1&gt;&lt;div class=&quot;small&quot;&gt;5 dadi • 3 lanci per turno • completa tutte le categorie&lt;/div&gt;&lt;/div&gt;

 &lt;div class=&quot;card&quot;&gt;
  &lt;div class=&quot;title&quot;&gt;👥 Partecipanti&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
   &lt;input id=&quot;playerName&quot; class=&quot;input&quot; placeholder=&quot;Nome giocatore&quot; autocomplete=&quot;off&quot;&gt;
   &lt;button class=&quot;btn&quot; onclick=&quot;addPlayer()&quot;&gt;Aggiungi&lt;/button&gt;
  &lt;/div&gt;
  &lt;div id=&quot;playersList&quot; class=&quot;list&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;validation&quot; class=&quot;validation&quot;&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;card&quot;&gt;
  &lt;div class=&quot;title&quot;&gt;📖 Regole di questa versione&lt;/div&gt;
  &lt;div class=&quot;small&quot; style=&quot;line-height:1.65&quot;&gt;
   Categorie 1–6 = somma dei soli dadi con quel numero. Bonus: 50 punti se la somma 1–6 supera 63, oppure 150 punti se supera 150.
   Coppia = 10 + gli altri dadi; doppia coppia = 20 + gli altri dadi; full = 25; tris/quattro/chance = somma totale;
   scala piccola = 30; scala grande = 40; Yahtzee = 50. Ogni Yahtzee successivo vale anche +100 punti sulla categoria scelta.
  &lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;card&quot;&gt;
  &lt;button id=&quot;startBtn&quot; class=&quot;btn full&quot; disabled onclick=&quot;startGame()&quot;&gt;🎲 Inizia nuova partita&lt;/button&gt;
 &lt;/div&gt;
&lt;/div&gt;

&lt;div id=&quot;game&quot; class=&quot;app hidden&quot;&gt;
 &lt;div class=&quot;card score-card&quot;&gt;
  &lt;div class=&quot;section-label compact-label&quot;&gt;&lt;h2&gt;🏆 Tabellone&lt;/h2&gt;&lt;/div&gt;
  &lt;div id=&quot;scoreWrap&quot; class=&quot;score-wrap&quot;&gt;&lt;/div&gt;
 &lt;/div&gt;
 &lt;div class=&quot;game-info-sticky&quot;&gt;
  &lt;div class=&quot;turn-line&quot;&gt;&lt;div&gt;&lt;span class=&quot;small&quot;&gt;TURNO&lt;/span&gt; &lt;strong id=&quot;turnName&quot;&gt;—&lt;/strong&gt;&lt;/div&gt;&lt;div id=&quot;rollBadge&quot; class=&quot;roll-badge&quot;&gt;Tiri rimasti: 3&lt;/div&gt;&lt;/div&gt;
  &lt;div id=&quot;diceArea&quot; class=&quot;dice-area&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;status&quot; class=&quot;status&quot;&gt;Premi “Lancia dadi” per iniziare.&lt;/div&gt;
  &lt;div class=&quot;dice-hint&quot;&gt;Tocca i dadi per conservarli.&lt;/div&gt;
 &lt;/div&gt;
 &lt;div class=&quot;game-actions&quot;&gt;&lt;button class=&quot;btn secondary&quot; onclick=&quot;confirmNewGame()&quot;&gt;↻ Nuova partita&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div id=&quot;gameOver&quot; class=&quot;app hidden&quot;&gt;
 &lt;div class=&quot;card game-over&quot;&gt;
  &lt;div style=&quot;font-size:64px&quot;&gt;🏆&lt;/div&gt;
  &lt;div class=&quot;small&quot;&gt;PARTITA TERMINATA&lt;/div&gt;
  &lt;h1&gt;Vince&lt;/h1&gt;
  &lt;div id=&quot;winnerName&quot; class=&quot;winner-name&quot;&gt;—&lt;/div&gt;
  &lt;div id=&quot;finalScores&quot; class=&quot;small&quot; style=&quot;line-height:1.8&quot;&gt;&lt;/div&gt;
  &lt;button class=&quot;btn full&quot; onclick=&quot;backToSetup()&quot;&gt;🎲 Nuova partita&lt;/button&gt;
 &lt;/div&gt;
&lt;/div&gt;

&lt;button id=&quot;rollBtn&quot; class=&quot;float-roll hidden&quot; onclick=&quot;rollDice()&quot;&gt;🎲 Lancia dadi &lt;span id=&quot;rollBtnCount&quot;&gt;3&lt;/span&gt;&lt;/button&gt;

&lt;script&gt;
const $=id=&gt;document.getElementById(id);
let players=JSON.parse(localStorage.getItem(&#x27;yatzee_players_v1&#x27;)||&#x27;[]&#x27;);
let gamePlayers=[],turn=0,rolls=0,dice=[1,1,1,1,1],held=[false,false,false,false,false],rolling=false;
function pairScore(d){
 const f=freq(d);
 const pairs=Object.keys(f).filter(k=&gt;f[k]&gt;=2).map(Number).sort((a,b)=&gt;a-b);
 if(!pairs.length)return 0;
 const pair=pairs[0];
 const remaining=d.slice();
 let removed=0;
 for(let i=remaining.length-1;i&gt;=0 &amp;&amp; removed&lt;2;i--){if(remaining[i]===pair){remaining.splice(i,1);removed++;}}
 return removed===2 ? 10 + sum(remaining) : 0;
}
function twoPairScore(d){
 const f=freq(d);
 const pairs=Object.keys(f).filter(k=&gt;f[k]&gt;=2).map(Number).sort((a,b)=&gt;a-b);
 if(pairs.length&lt;2)return 0;
 const singleton=Object.keys(f).map(Number).find(n=&gt;f[n]===1);
 if(singleton===undefined)return 0;
 return 20 + singleton;
}
const gameCategories=[
 {id:&#x27;ones&#x27;,name:&#x27;1&#x27;,desc:&#x27;Somma dei 1&#x27;,fn:d=&gt;sumN(d,1)},
 {id:&#x27;twos&#x27;,name:&#x27;2&#x27;,desc:&#x27;Somma dei 2&#x27;,fn:d=&gt;sumN(d,2)},
 {id:&#x27;threes&#x27;,name:&#x27;3&#x27;,desc:&#x27;Somma dei 3&#x27;,fn:d=&gt;sumN(d,3)},
 {id:&#x27;fours&#x27;,name:&#x27;4&#x27;,desc:&#x27;Somma dei 4&#x27;,fn:d=&gt;sumN(d,4)},
 {id:&#x27;fives&#x27;,name:&#x27;5&#x27;,desc:&#x27;Somma dei 5&#x27;,fn:d=&gt;sumN(d,5)},
 {id:&#x27;sixes&#x27;,name:&#x27;6&#x27;,desc:&#x27;Somma dei 6&#x27;,fn:d=&gt;sumN(d,6)},
 {id:&#x27;bonus&#x27;,name:&#x27;Bonus dadi&#x27;,desc:&#x27;&gt;63 = 50 • &gt;150 = 150&#x27;,fn:bonusScore},
 {id:&#x27;pair&#x27;,name:&#x27;Coppia&#x27;,desc:&#x27;10 + somma dadi restanti&#x27;,fn:pairScore},
 {id:&#x27;twoPair&#x27;,name:&#x27;Doppia coppia&#x27;,desc:&#x27;20 + somma dadi restanti&#x27;,fn:twoPairScore},
 {id:&#x27;full&#x27;,name:&#x27;Full House&#x27;,desc:&#x27;3 uguali + 2 uguali&#x27;,fn:d=&gt;counts(d).includes(3)&amp;&amp;counts(d).includes(2)?25:0},
 {id:&#x27;three&#x27;,name:&#x27;3 di un tipo&#x27;,desc:&#x27;Somma di tutti i dadi&#x27;,fn:d=&gt;counts(d).some(x=&gt;x&gt;=3)?sum(d):0},
 {id:&#x27;four&#x27;,name:&#x27;4 di un tipo&#x27;,desc:&#x27;Somma di tutti i dadi&#x27;,fn:d=&gt;counts(d).some(x=&gt;x&gt;=4)?sum(d):0},
 {id:&#x27;smallStraight&#x27;,name:&#x27;Scala piccola&#x27;,desc:&#x27;4 consecutivi = 30&#x27;,fn:d=&gt;hasSmallStraight(d)?30:0},
 {id:&#x27;largeStraight&#x27;,name:&#x27;Scala grande&#x27;,desc:&#x27;5 consecutivi = 40&#x27;,fn:d=&gt;hasLargeStraight(d)?40:0},
 {id:&#x27;yahtzee&#x27;,name:&#x27;Yahtzee&#x27;,desc:&#x27;5 dadi uguali = 50&#x27;,fn:d=&gt;new Set(d).size===1?50:0},
 {id:&#x27;chance&#x27;,name:&#x27;Chance&#x27;,desc:&#x27;Somma di tutti i numeri&#x27;,fn:d=&gt;sum(d)}
];
function sum(a){return a.reduce((x,y)=&gt;x+y,0)}
function sumN(d,n){return d.filter(x=&gt;x===n).reduce((a,b)=&gt;a+b,0)}
function counts(d){return Object.values(d.reduce((o,n)=&gt;(o[n]=(o[n]||0)+1,o),{}))}
function freq(d){return d.reduce((o,n)=&gt;(o[n]=(o[n]||0)+1,o),{})}
function uniqueSorted(d){return [...new Set(d)].sort((a,b)=&gt;a-b)}
function hasSmallStraight(d){const u=uniqueSorted(d);return [1,2,3,4].every(n=&gt;u.includes(n))||[2,3,4,5].every(n=&gt;u.includes(n))||[3,4,5,6].every(n=&gt;u.includes(n))}
function hasLargeStraight(d){const u=uniqueSorted(d);return u.length===5&amp;&amp;((u[0]===1&amp;&amp;u[4]===5)||(u[0]===2&amp;&amp;u[4]===6))}
function bonusScore(){const upper=gamePlayers[turn]?upperTotal(gamePlayers[turn]):0;return upper&gt;150?150:(upper&gt;63?50:0)}
function upperTotal(p){return [&#x27;ones&#x27;,&#x27;twos&#x27;,&#x27;threes&#x27;,&#x27;fours&#x27;,&#x27;fives&#x27;,&#x27;sixes&#x27;].reduce((s,id)=&gt;s+(p.scores[id]||0),0)}
function totalScore(p){return gameCategories.reduce((s,c)=&gt;s+(p.scores[c.id]||0),0)}
function yahtzeeCount(p){return p.yahtzees||0}
function addPlayer(){
 const n=$(&#x27;playerName&#x27;).value.trim();
 if(!n)return Swal.fire({title:&#x27;Errore&#x27;,text:&#x27;Inserisci un nome valido.&#x27;,icon:&#x27;error&#x27;,background:&#x27;#101e1b&#x27;,color:&#x27;#fff&#x27;});
 if(players.some(p=&gt;p.name.toLowerCase()===n.toLowerCase()))return Swal.fire({title:&#x27;Attenzione&#x27;,text:&#x27;Giocatore già presente.&#x27;,icon:&#x27;warning&#x27;,background:&#x27;#101e1b&#x27;,color:&#x27;#fff&#x27;});
 players.push({id:crypto.randomUUID(),name:n});localStorage.setItem(&#x27;yatzee_players_v1&#x27;,JSON.stringify(players));
 $(&#x27;playerName&#x27;).value=&#x27;&#x27;;renderPlayers();
}
function removePlayer(i){players.splice(i,1);localStorage.setItem(&#x27;yatzee_players_v1&#x27;,JSON.stringify(players));renderPlayers()}
function renderPlayers(){
 $(&#x27;playersList&#x27;).innerHTML=players.map((p,i)=&gt;`&lt;div class=&quot;player&quot;&gt;&lt;div class=&quot;avatar&quot;&gt;👤&lt;/div&gt;&lt;div class=&quot;pinfo&quot;&gt;&lt;div class=&quot;pname&quot;&gt;${esc(p.name)}&lt;/div&gt;&lt;div class=&quot;small&quot;&gt;Pronto per Yahtzee&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;btn danger&quot; onclick=&quot;removePlayer(${i})&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
 const ok=players.length&gt;=1;
 $(&#x27;validation&#x27;).innerHTML=ok?`&lt;span class=&quot;valid&quot;&gt;✓ ${players.length} ${players.length===1?&#x27;giocatore pronto&#x27;:&#x27;giocatori pronti&#x27;}&lt;/span&gt;`:`&lt;span class=&quot;invalid&quot;&gt;Aggiungi almeno un giocatore&lt;/span&gt;`;
 $(&#x27;startBtn&#x27;).disabled=!ok;
}
function esc(s){const d=document.createElement(&#x27;div&#x27;);d.textContent=s;return d.innerHTML}
$(&#x27;playerName&#x27;).addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;Enter&#x27;)addPlayer()});

function startGame(){
 gamePlayers=players.map(p=&gt;({id:p.id,name:p.name,scores:{},yahtzees:0}));
 turn=0;rolls=0;held=[false,false,false,false,false];dice=[1,1,1,1,1];
 $(&#x27;setup&#x27;).classList.add(&#x27;hidden&#x27;);$(&#x27;gameOver&#x27;).classList.add(&#x27;hidden&#x27;);$(&#x27;game&#x27;).classList.remove(&#x27;hidden&#x27;);$(&#x27;rollBtn&#x27;).classList.remove(&#x27;hidden&#x27;);
 renderDice();renderTable();updateTurnUI();
}
function updateTurnUI(){
 const p=gamePlayers[turn];$(&#x27;turnName&#x27;).textContent=p.name;
 $(&#x27;rollBadge&#x27;).textContent=`Lanci: ${rolls} / 3`;
 $(&#x27;rollBtnCount&#x27;).textContent=Math.max(0,3-rolls);
 $(&#x27;rollBtn&#x27;).disabled=rolls&gt;=3||rolling;
 $(&#x27;status&#x27;).textContent=rolls===0?&#x27;Premi “Lancia dadi” per iniziare.&#x27;:rolls&lt;3?&#x27;Seleziona i dadi da conservare, poi rilancia.&#x27;:&#x27;Hai esaurito i 3 lanci: scegli una casella.&#x27;;
}
function dieFace(n){
 const map={1:[4],2:[1,7],3:[1,4,7],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
 return `&lt;div class=&quot;die-face&quot;&gt;${Array.from({length:9},(_,i)=&gt;map[n].includes(i)?&#x27;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&#x27;:&#x27;&lt;span&gt;&lt;/span&gt;&#x27;).join(&#x27;&#x27;)}&lt;/div&gt;`;
}
function renderDice(){
 $(&#x27;diceArea&#x27;).innerHTML=dice.map((n,i)=&gt;`&lt;button class=&quot;die ${held[i]?&#x27;selected&#x27;:&#x27;&#x27;}&quot; aria-label=&quot;Dado ${i+1}: ${n}&quot; onclick=&quot;toggleHold(${i})&quot;&gt;${dieFace(n)}&lt;/button&gt;`).join(&#x27;&#x27;);
}
function toggleHold(i){
 if(rolls===0||rolling)return;
 held[i]=!held[i];renderDice();
}
function randomDie(){return Math.floor(Math.random()*6)+1}
function rollDice(){
 if(rolling||rolls&gt;=3)return;
 rolling=true;rolls++;
 const els=[...document.querySelectorAll(&#x27;.die&#x27;)];
 els.forEach((el,i)=&gt;{if(!held[i])el.classList.add(&#x27;rolling&#x27;)});
 const start=performance.now(),duration=620;
 function anim(now){
  const p=Math.min(1,(now-start)/duration);
  if(p&lt;1){
   els.forEach((el,i)=&gt;{if(!held[i]){dice[i]=randomDie();el.innerHTML=dieFace(dice[i])}});
   requestAnimationFrame(anim);
  }else{
   els.forEach(el=&gt;el.classList.remove(&#x27;rolling&#x27;));rolling=false;
   renderDice();renderTable();updateTurnUI();
  }
 }
 requestAnimationFrame(anim);
}
function previewScore(p,c){
 if(c.id===&#x27;bonus&#x27;)return bonusScore();
 let v=c.fn(dice);
 // Yahtzee bonus: ogni Yahtzee oltre il primo aggiunge 100 alla categoria selezionata.
 if(new Set(dice).size===1 &amp;&amp; p.yahtzees&gt;0 &amp;&amp; c.id!==&#x27;yahtzee&#x27;)v+=100;
 return v;
}
const categoryIcons={ones:&quot;⚀&quot;,twos:&quot;⚁&quot;,threes:&quot;⚂&quot;,fours:&quot;⚃&quot;,fives:&quot;⚄&quot;,sixes:&quot;⚅&quot;,bonus:&quot;⭐&quot;,pair:&quot;👥&quot;,twoPair:&quot;👥&quot;,full:&quot;🏠&quot;,three:&quot;3️⃣&quot;,four:&quot;4️⃣&quot;,smallStraight:&quot;📈&quot;,largeStraight:&quot;📊&quot;,yahtzee:&quot;🎲&quot;,chance:&quot;🍀&quot;};
function cellHtml(p,c,active=false){
 if(Object.prototype.hasOwnProperty.call(p.scores,c.id)) return `&lt;div class=&quot;score-cell locked&quot;&gt;${p.scores[c.id]}&lt;/div&gt;`;
 if(!active || rolls===0)return `&lt;div class=&quot;score-cell empty&quot;&gt;—&lt;/div&gt;`;
 const v=previewScore(p,c);
 return `&lt;div class=&quot;score-cell preview&quot; onclick=&quot;chooseScore(&#x27;${c.id}&#x27;)&quot;&gt;${v}&lt;/div&gt;`;
}
function renderTable(){
 const cols=gamePlayers.map(p=&gt;`&lt;th&gt;${esc(p.name)}&lt;div class=&quot;cat-sub&quot;&gt;${totalScore(p)} pt&lt;/div&gt;&lt;/th&gt;`).join(&#x27;&#x27;);
 let rows=&#x27;&#x27;;
 gameCategories.forEach(c=&gt;{
  rows+=`&lt;tr&gt;&lt;td&gt;&lt;div class=&quot;cat-name&quot;&gt;&lt;span class=&quot;cat-icon&quot;&gt;${categoryIcons[c.id]||&quot;•&quot;}&lt;/span&gt;${c.name}&lt;/div&gt;&lt;/td&gt;${gamePlayers.map((p,i)=&gt;`&lt;td&gt;${cellHtml(p,c,i===turn)}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`;
 });
 rows+=`&lt;tr class=&quot;total-row&quot;&gt;&lt;td&gt;Totale attuale&lt;/td&gt;${gamePlayers.map(p=&gt;`&lt;td&gt;${totalScore(p)}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`;
 rows+=`&lt;tr class=&quot;total-row&quot;&gt;&lt;td&gt;Yahtzee bonus&lt;/td&gt;${gamePlayers.map(p=&gt;`&lt;td class=&quot;score-cell ${p.yahtzees?&#x27;yatzee-bonus&#x27;:&#x27;&#x27;}&quot;&gt;${p.yahtzees?&#x27;+ &#x27;+(Math.max(0,p.yahtzees-1)*100):&#x27;—&#x27;}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`;
 rows+=`&lt;tr class=&quot;grand-row&quot;&gt;&lt;td&gt;TOTALE&lt;/td&gt;${gamePlayers.map(p=&gt;`&lt;td&gt;${totalScore(p)}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`;
 $(&#x27;scoreWrap&#x27;).innerHTML=`&lt;table class=&quot;score-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Categoria&lt;/th&gt;${cols}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows}&lt;/tbody&gt;&lt;/table&gt;`;
}
async function chooseScore(id){
 if(rolling||rolls===0)return;
 const p=gamePlayers[turn],c=gameCategories.find(x=&gt;x.id===id);

 const isY=new Set(dice).size===1;
 const result=await Swal.fire({
  title:c.name,
  html:`&lt;div style=&quot;font-size:38px;font-weight:900;color:#19c99e&quot;&gt;${v}&lt;/div&gt;&lt;div style=&quot;margin-top:6px;color:#9db7b0&quot;&gt;${isY&amp;&amp;p.yahtzees?&#x27;Include +100 bonus Yahtzee.&#x27;:&#x27;&#x27;}&lt;/div&gt;`,
  showCancelButton:true,confirmButtonText:&#x27;Assegna punteggio&#x27;,cancelButtonText:&#x27;Annulla&#x27;,
  background:&#x27;#101e1b&#x27;,color:&#x27;#fff&#x27;
 });
 if(!result.isConfirmed)return;
 p.scores[id]=v;
 if(isY)p.yahtzees++;
 const completed=gameCategories.every(x=&gt;Object.prototype.hasOwnProperty.call(p.scores,x.id));
 if(completed){finishGame();return}
 turn=(turn+1)%gamePlayers.length;rolls=0;held=[false,false,false,false,false];dice=[1,1,1,1,1];

}
function finishGame(){
 $(&#x27;game&#x27;).classList.add(&#x27;hidden&#x27;);$(&#x27;rollBtn&#x27;).classList.add(&#x27;hidden&#x27;);$(&#x27;gameOver&#x27;).classList.remove(&#x27;hidden&#x27;);
 const ranked=[...gamePlayers].sort((a,b)=&gt;totalScore(b)-totalScore(a)),winner=ranked[0];
 $(&#x27;winnerName&#x27;).textContent=winner.name;

}
async function confirmNewGame(){
 const r=await Swal.fire({title:&#x27;Sei sicuro di iniziare una nuova partita?&#x27;,text:&#x27;Il tabellone verrà azzerato e tornerai all’inserimento dei giocatori. I giocatori salvati resteranno disponibili.&#x27;,icon:&#x27;warning&#x27;,showCancelButton:true,confirmButtonText:&#x27;Sì, nuova partita&#x27;,cancelButtonText:&#x27;Annulla&#x27;,background:&#x27;#101e1b&#x27;,color:&#x27;#fff&#x27;});

}

function backToSetup(){gamePlayers=[];turn=0;rolls=0;dice=[1,1,1,1,1];held=[false,false,false,false,false];rolling=false;$(&#x27;game&#x27;).classList.add(&#x27;hidden&#x27;);$(&#x27;gameOver&#x27;).classList.add(&#x27;hidden&#x27;);$(&#x27;setup&#x27;).classList.remove(&#x27;hidden&#x27;);$(&#x27;rollBtn&#x27;).classList.add(&#x27;hidden&#x27;);renderPlayers()}
renderPlayers();

&lt;div class=&quot;toast&quot; id=&quot;toast&quot;&gt;&lt;/div&gt;

&lt;script&gt;
const canvas=document.getElementById(&#x27;wheel&#x27;),ctx=canvas.getContext(&#x27;2d&#x27;);
const entriesEl=document.getElementById(&#x27;entries&#x27;),countEl=document.getElementById(&#x27;count&#x27;);
let entries=JSON.parse(localStorage.getItem(&#x27;spinwheel_entries&#x27;)||&#x27;[&quot;Andrea&quot;,&quot;Marco&quot;,&quot;Giulia&quot;,&quot;Francesca&quot;,&quot;Luca&quot;,&quot;Sofia&quot;,&quot;Matteo&quot;,&quot;Elena&quot;]&#x27;);
let rotation=0,spinning=false;
const palette=[&#x27;#ff5b6e&#x27;,&#x27;#ff9f43&#x27;,&#x27;#ffd93d&#x27;,&#x27;#3ddc97&#x27;,&#x27;#32c5ff&#x27;,&#x27;#6c63ff&#x27;,&#x27;#b56cff&#x27;,&#x27;#ff6bb5&#x27;,&#x27;#36d1b4&#x27;,&#x27;#ff7f50&#x27;,&#x27;#4facfe&#x27;,&#x27;#9b59b6&#x27;];

function syncTextarea(){entriesEl.value=entries.join(&#x27;\\n&#x27;);countEl.textContent=entries.length+&#x27; &#x27;+(entries.length===1?&#x27;voce&#x27;:&#x27;voci&#x27;);localStorage.setItem(&#x27;spinwheel_entries&#x27;,JSON.stringify(entries));draw();}
function secureRandom(max){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}
function draw(){
 const n=entries.length;ctx.clearRect(0,0,900,900);if(!n)return;
 const cx=450,cy=450,r=440,arc=Math.PI*2/n;
 for(let i=0;i&lt;n;i++){
   const start=rotation+i*arc-Math.PI/2;
   ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+arc);ctx.closePath();
   ctx.fillStyle=palette[i%palette.length];ctx.fill();ctx.strokeStyle=&#x27;rgba(255,255,255,.75)&#x27;;ctx.lineWidth=3;ctx.stroke();
   ctx.save();ctx.translate(cx,cy);ctx.rotate(start+arc/2);ctx.textAlign=&#x27;right&#x27;;
   ctx.fillStyle=&#x27;#fff&#x27;;ctx.font=`700 ${Math.min(32,Math.max(16,430/n))}px Arial`;
   let text=entries[i];if(text.length&gt;18)text=text.slice(0,17)+&#x27;…&#x27;;ctx.fillText(text,r-42,8);ctx.restore();
 }
 ctx.beginPath();ctx.arc(cx,cy,62,0,Math.PI*2);ctx.fillStyle=&#x27;#fff&#x27;;ctx.fill();
}
function updateEntries(){
 entries=entriesEl.value.split(&#x27;\\n&#x27;).map(x=&gt;x.trim()).filter(Boolean);syncTextarea();
}
entriesEl.addEventListener(&#x27;input&#x27;,updateEntries);
function toast(msg){const t=document.getElementById(&#x27;toast&#x27;);t.textContent=msg;t.classList.add(&#x27;show&#x27;);setTimeout(()=&gt;t.classList.remove(&#x27;show&#x27;),2200)}
function beep(freq=500,dur=.03){
 if(!document.getElementById(&#x27;sound&#x27;).checked)return;
 try{const ac=new (window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.stop(ac.currentTime+dur)}catch(e){}
}
function spin(){
 if(spinning)return;if(entries.length&lt;2){toast(&#x27;Inserisci almeno 2 voci&#x27;);return}
 spinning=true;document.getElementById(&#x27;spinBtn&#x27;).disabled=true;
 const winnerIndex=secureRandom(entries.length),n=entries.length,arc=360/n;
 const targetCenter=-(winnerIndex*arc+arc/2);
 const currentDeg=((rotation*180/Math.PI)%360+360)%360;
 const target=((targetCenter%360)+360)%360;
 const delta=((target-currentDeg)+360)%360;
 const extra=(7+secureRandom(5))*360;
 const start=rotation,end=rotation+(extra+delta)*Math.PI/180;
 const duration=+document.getElementById(&#x27;duration&#x27;).value*1000,startTime=performance.now();
 let lastTick=0;
 function animate(now){
   const p=Math.min(1,(now-startTime)/duration),ease=1-Math.pow(1-p,4);
   rotation=start+(end-start)*ease;draw();
   if(now-lastTick&gt;90){beep(350+Math.random()*250,.025);lastTick=now}
   if(p&lt;1)requestAnimationFrame(animate);else{
     rotation=end;draw();spinning=false;document.getElementById(&#x27;spinBtn&#x27;).disabled=false;beep(800,.12);
     setTimeout(()=&gt;showWinner(winnerIndex),350);
   }
 }
 requestAnimationFrame(animate);
}
function showWinner(index){const winner=entries[index];document.getElementById(&#x27;winnerName&#x27;).textContent=winner;document.getElementById(&#x27;modal&#x27;).classList.add(&#x27;show&#x27;);confetti();if(document.getElementById(&#x27;removeWinner&#x27;).checked){entries.splice(index,1);syncTextarea();}}
function confetti(){for(let i=0;i&lt;100;i++){const e=document.createElement(&#x27;i&#x27;);e.className=&#x27;confetti&#x27;;e.style.left=Math.random()*100+&#x27;vw&#x27;;e.style.background=palette[i%palette.length];e.style.transform=`rotate(${Math.random()*360}deg)`;document.body.appendChild(e);const d=900+Math.random()*1700;e.animate([{transform:e.style.transform,top:&#x27;-20px&#x27;},{transform:`translate(${(Math.random()-.5)*240}px,0) rotate(${Math.random()*1000}deg)`,top:&#x27;110vh&#x27;}],{duration:d,easing:&#x27;cubic-bezier(.2,.8,.4,1)&#x27;}).onfinish=()=&gt;e.remove()}}
document.getElementById(&#x27;spinBtn&#x27;).onclick=spin;document.getElementById(&#x27;centerSpin&#x27;).onclick=spin;canvas.onclick=spin;
document.getElementById(&#x27;duration&#x27;).oninput=e=&gt;document.getElementById(&#x27;durationLabel&#x27;).textContent=e.target.value+&#x27;s&#x27;;

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script>
let currentApp = null;

function openApp(id){
 currentApp = id;
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.body.style.background = id==='wheel' ? '#f4f6fb' : '#090a10';
 window.scrollTo(0,0);
 history.pushState({app: id}, '');
}

async function goHomeConfirm(){
 const isLight = currentApp === 'wheel';
 const r = await Swal.fire({
   title: 'Tornare indietro?',
   text: 'Sei sicuro di voler abbandonare questa partita?',
   icon: 'warning',
   showCancelButton: true,
   confirmButtonText: 'Sì, esci',
   cancelButtonText: 'Annulla',
   background: isLight ? '#fff' : '#161822',
   color: isLight ? '#252b3a' : '#fff'
 });
 
 if(r.isConfirmed) {
   currentApp = null;
   goHome();
 } else {
   // Se chiamato dal tasto Indietro (popstate), rimettiamo lo stato per non farlo sfuggire
   history.pushState({app: currentApp}, '');
 }
}

function goHome(){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById('home').classList.add('active');
 document.body.style.background='#090b14';
 window.scrollTo(0,0);
}

// Inizializzazione della history per intercettare il tasto "indietro" del browser
history.replaceState({hub: true}, '');
window.addEventListener('popstate', async (e) => {
  if(currentApp) {
    // Siamo in un'app, spingiamo di nuovo lo stato e mostriamo il blocco con Swal
    history.pushState({app: currentApp}, '');
    await goHomeConfirm();
  }
});

// Blocco ricaricamento pagina (F5, Cmd+R). 
// NOTA: Usa l'alert di sistema obbligato dai browser.
window.addEventListener('beforeunload',e=>{if(currentApp){e.preventDefault();e.returnValue=''}});
let sy=0;document.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});document.addEventListener('touchmove',e=>{if(currentApp&&scrollY<=0&&e.touches[0].clientY-sy>50)e.preventDefault()},{passive:false});
</script>
